<!DOCTYPE html>
<html lang="{{HTML_LANG}}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    /* 默认深青蓝 accent；实际页面按厂商替换为对应主题色，见 references/page-style.md */
    --bg: #ffffff;
    --bg-elevated: #ffffff;
    --bg-soft: #f4f6f8;
    --bg-hover: #edf1f4;
    --bg-tint: #eef4f6;
    --border: #e6eaee;
    --border-strong: #d3dae0;
    --text: #10151a;
    --text-dim: #4d5a64;
    --text-faint: #8b98a1;
    --accent: #0e7490;
    --accent-bright: #0a5c73;
    --accent-deep: #083d4d;
    --accent-soft: rgba(14, 116, 144, 0.09);
    --accent-border: rgba(14, 116, 144, 0.34);
    --accent-glow: rgba(14, 116, 144, 0.14);
    --best: #0d9463;
    --best-bg: rgba(13, 148, 99, 0.09);
    --best-border: rgba(13, 148, 99, 0.3);
    --warn: #b4791f;
    --warn-bg: rgba(180, 121, 31, 0.09);
    --warn-border: rgba(180, 121, 31, 0.32);
    --orange: #c25e1c;
    --orange-bg: rgba(194, 94, 28, 0.09);
    --orange-border: rgba(194, 94, 28, 0.3);
    --danger: #c2493d;
    --danger-bg: rgba(194, 73, 61, 0.09);
    --danger-border: rgba(194, 73, 61, 0.3);
    --shadow-color: 200, 30%, 40%;
    --font-display: 'Sora', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    --font-sans: 'Manrope', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  ::selection { background: var(--accent-soft); color: var(--accent-bright); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-soft); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    position: relative;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.9;
    z-index: 60;
  }

  /* ===== 通用图标 ===== */
  .ic {
    width: 1em; height: 1em;
    display: inline-block;
    vertical-align: -0.14em;
    flex-shrink: 0;
  }

  /* ===== 页头 ===== */
  .hero {
    padding: 48px 32px 32px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 80% at 85% -10%, var(--accent-glow), transparent 60%),
      linear-gradient(var(--bg-tint), var(--bg) 70%);
    border-bottom: 1px solid var(--border);
  }
  /* 细网格纹理，呼应"实验室/工程图纸"气质 */
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 75%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 75%);
    pointer-events: none;
  }
  .hero > * { position: relative; }
  .hero-ornament {
    position: absolute;
    right: -20px;
    top: 50%;
    width: 340px;
    height: 340px;
    transform: translateY(-50%);
    color: var(--accent);
    opacity: 0.12;
    pointer-events: none;
    z-index: 0;
  }
  @media (max-width: 900px) {
    .hero-ornament { width: 220px; height: 220px; opacity: 0.08; right: -30px; }
  }
  .hero-inner { max-width: 1400px; margin: 0 auto; }
  .hero-top { display: flex; align-items: center; gap: 11px; margin-bottom: 16px; }
  .logo-mark { width: 26px; height: 26px; color: var(--accent-deep); flex-shrink: 0; }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  /* 语言切换器：页头右上角 中 / EN 静态互链（嵌入模式下页头隐藏，随页头一起不出现） */
  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-left: auto;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-elevated);
    padding: 2px;
    flex-shrink: 0;
  }
  .lang-opt {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1;
    color: var(--text-faint);
    text-decoration: none;
    padding: 5px 9px;
    border-radius: 6px;
    transition: color 0.15s, background 0.15s;
  }
  a.lang-opt:hover { color: var(--accent-bright); background: var(--bg-hover); }
  .lang-opt.on {
    color: #fff;
    background: var(--accent);
    pointer-events: none;
  }
  @media (max-width: 900px) {
    .lang-switch { margin-left: 8px; }
  }
  .hero h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 36px;
    letter-spacing: -0.025em;
    line-height: 1.15;
    margin: 0 0 12px;
    color: var(--text);
  }
  .hero h1 .title-sep { color: var(--accent); font-weight: 400; margin: 0 4px; }
  .hero-desc {
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0 0 28px;
    line-height: 1.7;
  }
  .hero-desc a {
    color: var(--accent-bright);
    text-decoration: underline;
    text-underline-offset: 3px;
  }
  .hero-desc a:hover { color: var(--text); }
  .stat-strip { display: flex; align-items: center; gap: 24px; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-num {
    font-family: var(--font-mono);
    font-size: 24px;
    font-weight: 600;
    color: var(--accent-bright);
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.01em;
  }
  .stat-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-faint);
    letter-spacing: 0.02em;
  }
  .stat-label .ic { font-size: 13px; color: var(--accent); opacity: 0.8; }
  .stat-divider { width: 1px; height: 30px; background: var(--border-strong); }

  /* ===== 锚点导航（复用 tabs 风格，吸顶）===== */
  .nav {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.94);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
  }
  .nav-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 20px;
    overflow-x: auto;
    scrollbar-width: none;
  }
  .nav-inner::-webkit-scrollbar { display: none; }
  .nav a {
    padding: 12px 6px;
    margin-bottom: -1px;
    color: var(--text-faint);
    font-weight: 600;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    border-bottom: 2px solid transparent;
    text-decoration: none;
    white-space: nowrap;
    transition: color 0.15s, border-color 0.15s;
  }
  .nav a:hover { color: var(--accent-bright); border-bottom-color: var(--accent-border); }
  .nav a:focus-visible { outline: 2px solid var(--accent-border); outline-offset: -2px; }
  /* 滚动跟随高亮（JS 写入 .active；无 JS 时下方纯 CSS :target 规则兜底） */
  .nav a.active { color: var(--accent-bright); border-bottom-color: var(--accent); }
  /* 当前锚点高亮（纯 CSS :has(:target)，点击导航后对应项显示 accent 下划线） */
  {{NAV_SPY_CSS}}

  /* 嵌入模式：在 index.html 标签页内（?embed=1）隐藏页头与顶部装饰线，避免与外层框架重复 */
  .embedded body::before { display: none; }
  .embedded .hero { display: none; }

  /* ===== 主体 ===== */
  .wrap { max-width: 1400px; margin: 0 auto; padding: 0 32px; }
  .sec { padding: 38px 0 4px; scroll-margin-top: 60px; }
  .sec-head {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .sec-head .ic { font-size: 17px; color: var(--accent); }
  .sec-title {
    font-family: var(--font-display);
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
    color: var(--text);
    white-space: nowrap;
  }
  /* 标题右侧延伸的细分隔线，仪器面板感 */
  .sec-head::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  .sec-desc { color: var(--text-dim); font-size: 13px; margin-bottom: 18px; line-height: 1.7; }
  .sec-desc .mono { font-family: var(--font-mono); color: var(--accent-bright); font-size: 0.94em; }

  /* ===== 标签（药丸，统一 22px 等高保证表格行高节奏一致）===== */
  .tag {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    height: 22px;
    padding: 0 9px;
    border-radius: 999px;
    border: 1px solid var(--border);
    background: var(--bg-soft);
    color: var(--text-dim);
    font-size: 11.5px;
    font-weight: 500;
    white-space: nowrap;
    box-sizing: border-box;
  }
  .tag .ic { font-size: 12px; }
  .t-teal { background: var(--accent-soft); border-color: var(--accent-border); color: var(--accent-bright); }
  .t-green { background: var(--best-bg); border-color: var(--best-border); color: var(--best); }
  .t-amber { background: var(--warn-bg); border-color: var(--warn-border); color: var(--warn); }
  .t-orange { background: var(--orange-bg); border-color: var(--orange-border); color: var(--orange); }
  .t-red { background: var(--danger-bg); border-color: var(--danger-border); color: var(--danger); }
  /* 价格 pill 内的 $ 符号：等宽、降字距 */
  .tag .ps { font-family: var(--font-mono); font-weight: 600; letter-spacing: -0.06em; }

  /* 定位列轻标记：6px 圆点 + 着色文字（无底无框，与价格列底色药丸拉开视觉通道） */
  .tier-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
  }
  .tier-tag::before {
    content: '';
    width: 6px; height: 6px;
    border-radius: 50%;
    background: currentColor;
    flex-shrink: 0;
  }
  .tier-tag.t-flag { color: var(--warn); }
  .tier-tag.t-bal { color: var(--accent-bright); }
  .tier-tag.t-bud { color: var(--best); }

  /* 价格档位阶梯条：一格一档，高度递增，实心=档位色、空槽=灰 */
  .bars { display: inline-flex; align-items: flex-end; gap: 2px; height: 14px; }
  .bars i { width: 3px; border-radius: 1px; background: var(--border-strong); }
  .bars i.on { background: currentColor; }
  .bars i:nth-child(1) { height: 4px; }
  .bars i:nth-child(2) { height: 6px; }
  .bars i:nth-child(3) { height: 8px; }
  .bars i:nth-child(4) { height: 10px; }
  .bars i:nth-child(5) { height: 12px; }
  .bars i:nth-child(6) { height: 14px; }

  /* 模态纯图标标识（title 属性提供悬停文字） */
  .tag.mod-ico { padding: 0 7px; cursor: help; }
  .tag.mod-ico .ic { font-size: 13px; vertical-align: -0.18em; }
  /* 价格纯阶梯条标识（档名在 title 中，颜色即档位） */
  .tag.price-ico { padding: 0 7px; cursor: help; }
  /* 等级点阵（推理强度等共用色相时的区分手段） */
  .dots { display: inline-flex; gap: 3px; align-items: center; }
  .dots i { width: 5px; height: 5px; border-radius: 50%; background: var(--border-strong); }
  .dots i.on { background: currentColor; }

  /* ===== 徽章（模型名旁的微型标记）===== */
  .badge {
    display: inline-block;
    font-family: var(--font-mono);
    font-size: 9.5px;
    font-weight: 600;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 1px 6px;
    border-radius: 4px;
    margin-left: 6px;
    vertical-align: 1px;
    border: 1px solid transparent;
  }
  /* 徽章统一实心强调（白字彩底），颜色区分语义 */
  .b-new { color: #f4fbfd; background: var(--accent); border-color: var(--accent); }
  .b-rec { color: #fff; background: var(--best); border-color: var(--best); }
  .b-pro { color: #fff; background: var(--warn); border-color: var(--warn); }
  .b-prev { color: #fff; background: var(--text-dim); border-color: var(--text-dim); }
  .b-oss { color: #f4fbfd; background: var(--accent-deep); border-color: var(--accent-deep); }
  .b-dep { color: #fff; background: var(--danger); border-color: var(--danger); }

  /* ===== 表格 ===== */
  .table-panel {
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow-x: auto;
    background: var(--bg);
  }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th, td {
    padding: 10px 14px;
    text-align: left;
    vertical-align: middle;
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
  }
  th {
    background: var(--bg-soft);
    font-family: var(--font-sans);
    font-size: 11.5px;
    letter-spacing: 0.04em;
    font-weight: 600;
    color: var(--text-faint);
    border-bottom: 1px solid var(--border-strong);
  }
  tbody tr:last-child td { border-bottom: none; }
  tbody tr:hover { background: var(--bg-hover); }
  tbody tr:hover td:first-child { box-shadow: inset 3px 0 0 var(--accent); }
  /* 行入场：仅定义 from，各行回到自身自然不透明度（弃用区 0.82 不受影响） */
  @keyframes rowIn { from { opacity: 0; transform: translateY(3px); } }
  tbody tr { animation: rowIn 0.3s ease both; }
  tbody tr:nth-child(2) { animation-delay: 0.02s; }
  tbody tr:nth-child(3) { animation-delay: 0.04s; }
  tbody tr:nth-child(4) { animation-delay: 0.06s; }
  tbody tr:nth-child(5) { animation-delay: 0.08s; }
  tbody tr:nth-child(6) { animation-delay: 0.1s; }
  tbody tr:nth-child(7) { animation-delay: 0.12s; }
  tbody tr:nth-child(8) { animation-delay: 0.14s; }
  tbody tr:nth-child(n+9) { animation-delay: 0.16s; }

  .model-id {
    font-family: var(--font-mono);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent-bright);
  }
  .ctx {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--text-dim);
    font-variant-numeric: tabular-nums;
  }
  .ctx.hi { color: var(--accent-bright); font-weight: 600; }
  .num { font-family: var(--font-mono); font-size: 12.5px; font-weight: 600; color: var(--text); font-variant-numeric: tabular-nums; }
  .mono-dim { font-family: var(--font-mono); font-size: 12px; color: var(--text-dim); }
  .mods { display: flex; flex-wrap: wrap; gap: 4px; }
  td.mdesc {
    white-space: normal;
    min-width: 170px;
    color: var(--text-dim);
    font-size: 12.5px;
    line-height: 1.55;
  }
  td.plain { color: var(--text-dim); font-size: 12.5px; }

  /* 类型列：输入图标 → 输出图标 的流向表达 */
  .flow { display: inline-flex; align-items: center; gap: 4px; color: var(--text-dim); font-size: 12.5px; }
  .flow .ic { font-size: 13px; color: var(--accent); }
  .flow .arr { font-size: 10px; color: var(--text-faint); }
  .flow .fl { margin-left: 4px; }

  /* 命名规律表首列 */
  .rules td:first-child {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-bright);
    font-weight: 600;
  }

  /* 已弃用区 */
  .deprecated .model-id { color: var(--danger); }
  .deprecated tbody tr { opacity: 0.82; }
  .deprecated .arrow-sep { color: var(--text-faint); margin-right: 4px; }

  /* ===== 图例面板 ===== */
  .legend {
    background: var(--bg-soft);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 18px 22px;
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 14px 28px;
  }
  .legend-group { display: flex; align-items: flex-start; gap: 14px; }
  .legend-group.wide { grid-column: 1 / -1; }
  .legend-title {
    font-family: var(--font-mono);
    font-size: 10.5px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-faint);
    min-width: 60px;
    padding-top: 4px;
    flex-shrink: 0;
  }
  .legend-items { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .legend-note { font-size: 11px; color: var(--text-faint); margin-left: 4px; }
  .legend-range { font-family: var(--font-mono); font-size: 10.5px; opacity: 0.75; margin-left: 2px; }

  /* ===== 快速选型 ===== */
  .quick-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
  }
  .quick-card {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: var(--bg-elevated);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 13px 16px;
    transition: border-color 0.15s, box-shadow 0.15s, transform 0.15s;
  }
  .quick-card:hover {
    border-color: var(--accent-border);
    box-shadow: 0 8px 20px -8px hsla(var(--shadow-color), 0.2);
    transform: translateY(-1px);
  }
  .quick-task {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-weight: 600;
    font-size: 13px;
    color: var(--text);
  }
  .quick-task .ic { color: var(--accent); font-size: 14px; }
  .quick-model {
    font-family: var(--font-mono);
    font-size: 12px;
    color: var(--accent-bright);
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    border-radius: 6px;
    padding: 4px 10px;
    white-space: nowrap;
  }

  /* 能力矩阵场景列 */
  .scene { display: inline-flex; align-items: center; gap: 7px; font-weight: 500; color: var(--text); }
  .scene .ic { color: var(--accent); font-size: 14px; }
  .scene-note { color: var(--text-faint); font-size: 11px; font-weight: 400; }

  /* ===== 页脚 ===== */
  .footer {
    border-top: 1px solid var(--border);
    margin-top: 46px;
    padding: 26px 32px 38px;
    text-align: center;
    color: var(--text-faint);
    font-size: 12.5px;
    line-height: 2;
  }
  .footer b { color: var(--text-dim); }
  .footer .rules { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); }
  .footer a { color: var(--accent-bright); text-decoration: none; }
  .footer a:hover { text-decoration: underline; }

  /* ===== 响应式 ===== */
  @media (max-width: 900px) {
    .quick-grid { grid-template-columns: repeat(2, 1fr); }
    .legend { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .hero { padding: 36px 20px 26px; }
    .hero h1 { font-size: 26px; }
    .nav { padding: 0 20px; }
    .wrap { padding: 0 20px; }
    .quick-grid { grid-template-columns: 1fr; }
    th, td { padding: 8px 10px; }
    .stat-strip { gap: 16px; }
  }
  /* 键盘焦点：细青框，仪器校准感 */
  a:focus-visible, button:focus-visible { outline: 2px solid var(--accent-border); outline-offset: 2px; border-radius: 2px; }
  /* 减弱动态：关闭平滑滚动与行入场 */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    tbody tr { animation: none; }
  }
</style>
<!-- 嵌入检测必须在 head 同步执行：在 body 解析前给 <html> 加 .embedded，hero 从首帧起即不渲染（放 body 末尾会导致页头闪现） -->

<script>
(function () {
  // 语言切换链接：保持 ?embed=1 嵌入态（iframe 内切换语言不跳出嵌入模式）
  var q = location.search;
  document.querySelectorAll('a[data-lang-href]').forEach(function (a) {
    if (q) {
      a.href = a.getAttribute('data-lang-href') + q;
    }
  });
  // 滚动跟随高亮：渐进增强，无 JS 时纯 CSS :target 规则仍生效（嵌入检测见 head，须在首帧前执行）
  var links = Array.prototype.slice.call(document.querySelectorAll('.nav a[href^="#"]'));
  if (!links.length) return;
  var secs = links
    .map(function (a) { return document.getElementById(a.getAttribute('href').slice(1)); })
    .filter(Boolean);
  var current = null;
  function setActive(id) {
    if (id === current) return;
    current = id;
    links.forEach(function (a) {
      a.classList.toggle('active', a.getAttribute('href') === '#' + id);
    });
  }
  var ticking = false;
  function onScroll() {
    if (ticking) return;
    ticking = true;
    requestAnimationFrame(function () {
      ticking = false;
      var pos = window.scrollY + 64; // 吸顶导航高度余量
      var id = null;
      for (var i = 0; i < secs.length; i++) {
        if (secs[i].offsetTop <= pos) id = secs[i].id; else break;
      }
      // 滚到底部时锁定最后一节（末节可能短于剩余视口）
      if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 2 && secs.length) {
        id = secs[secs.length - 1].id;
      }
      setActive(id);
    });
  }
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
})();
</script>
