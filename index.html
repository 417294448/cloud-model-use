<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>大模型选型与场景指南</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Noto+Sans+SC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --bg-soft: #f4f6f8;
    --bg-hover: #edf1f4;
    --bg-tint: #eef4f6;
    --border: #e6eaee;
    --border-strong: #d3dae0;
    --text: #10151a;
    --text-dim: #4d5a64;
    --text-faint: #8b98a1;
    --accent: #0e7490;
    --accent-bright: #0a5c73;
    --accent-deep: #083d4d;
    --accent-soft: rgba(14, 116, 144, 0.09);
    --accent-border: rgba(14, 116, 144, 0.34);
    --font-display: 'Sora', 'Noto Sans SC', 'PingFang SC', system-ui, sans-serif;
    --font-mono: 'JetBrains Mono', 'Cascadia Code', Consolas, monospace;
    --font-sans: 'Manrope', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  ::selection { background: var(--accent-soft); color: var(--accent-bright); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--bg-soft); }
  ::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 6px; }
  ::-webkit-scrollbar-thumb:hover { background: var(--accent); }
  body {
    font-family: var(--font-sans);
    background: var(--bg);
    color: var(--text);
    font-size: 14px;
    line-height: 1.6;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  body::before {
    content: '';
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--accent), transparent);
    opacity: 0.9;
    z-index: 60;
  }

  .hero {
    padding: 40px 32px 24px;
    position: relative;
    overflow: hidden;
    background:
      radial-gradient(ellipse 60% 80% at 85% -10%, rgba(14, 116, 144, 0.14), transparent 60%),
      linear-gradient(var(--bg-tint), var(--bg) 70%);
    border-bottom: 1px solid var(--border);
  }
  .hero::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(var(--border) 1px, transparent 1px),
      linear-gradient(90deg, var(--border) 1px, transparent 1px);
    background-size: 56px 56px;
    -webkit-mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 75%);
    mask-image: linear-gradient(to bottom, rgba(0,0,0,0.5), transparent 75%);
    pointer-events: none;
  }
  .hero > * { position: relative; }
  .hero-inner { max-width: 1400px; margin: 0 auto; }
  .hero-top { display: flex; align-items: center; gap: 11px; margin-bottom: 14px; }
  .logo-mark { width: 26px; height: 26px; color: var(--accent-deep); flex-shrink: 0; }
  .hero-eyebrow {
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--accent);
    font-weight: 500;
  }
  .hero h1 {
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 34px;
    letter-spacing: -0.025em;
    line-height: 1.15;
    margin: 0 0 10px;
  }
  .hero-desc {
    color: var(--text-dim);
    font-size: 13.5px;
    margin: 0 0 22px;
    line-height: 1.7;
  }
  .stat-strip { display: flex; align-items: center; gap: 24px; }
  .stat { display: flex; flex-direction: column; gap: 4px; }
  .stat-num {
    font-family: var(--font-mono);
    font-size: 22px;
    font-weight: 600;
    color: var(--accent-bright);
    font-variant-numeric: tabular-nums;
  }
  .stat-label {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-faint);
    letter-spacing: 0.02em;
  }
  .stat-label .ic { font-size: 13px; color: var(--accent); opacity: 0.8; }
  .stat-divider { width: 1px; height: 30px; background: var(--border-strong); }

  .ic {
    width: 1em; height: 1em;
    display: inline-block;
    vertical-align: -0.14em;
    flex-shrink: 0;
  }

  /* ===== Tabs ===== */
  .tabs {
    position: sticky;
    top: 0;
    z-index: 50;
    background: rgba(255, 255, 255, 0.96);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--border);
    padding: 0 32px;
  }
  .tabs-inner {
    max-width: 1400px;
    margin: 0 auto;
    display: flex;
    gap: 8px;
  }
  .tab-btn {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 13px 18px;
    margin-bottom: -1px;
    background: none;
    border: none;
    border-bottom: 2px solid transparent;
    color: var(--text-faint);
    font-family: var(--font-sans);
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.02em;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s, background 0.15s;
    white-space: nowrap;
  }
  /* 品牌 logo：略大于字号保持视觉平衡，颜色随按钮状态（currentColor） */
  .tab-logo { font-size: 14px; }
  .tab-btn:hover { color: var(--accent-bright); background: var(--bg-soft); }
  .tab-btn:focus-visible { outline: 2px solid var(--accent-border); outline-offset: -2px; }
  .tab-btn.active {
    color: var(--accent-bright);
    border-bottom-color: var(--accent);
    background: var(--bg-tint);
  }

  /* 全局语言切换器：页面右上角（hero 顶部） 中 / EN，样式与各厂商页面内切换器一致 */
  .lang-switch {
    display: inline-flex;
    align-items: center;
    gap: 2px;
    margin-left: auto;
    align-self: center;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: var(--bg-elevated);
    padding: 2px;
    flex-shrink: 0;
  }
  .lang-opt {
    font-family: var(--font-mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.08em;
    line-height: 1;
    color: var(--text-faint);
    text-decoration: none;
    padding: 5px 9px;
    border-radius: 6px;
    border: none;
    background: none;
    cursor: pointer;
    transition: color 0.15s, background 0.15s;
  }
  a.lang-opt:hover, button.lang-opt:hover { color: var(--accent-bright); background: var(--bg-hover); }
  .lang-opt.on {
    color: #fff;
    background: var(--accent);
    pointer-events: none;
  }

  /* 内容区吃掉剩余视口高度，页脚自然落底（替代 100vh - 186px 魔法数） */
  .tab-panels {
    position: relative;
    flex: 1;
    min-height: 560px;
    display: flex;
    flex-direction: column;
  }
  .tab-panel {
    display: none;
    position: relative;
    background: var(--bg-soft);
  }
  /* 激活面板全程 flex 布局：嵌套 flex 直接分配实高，规避 height:100% 沿链解析失败 */
  .tab-panel.active { display: flex; flex-direction: column; flex: 1; min-height: 0; }
  /* iframe 加载完成前的占位提示（加载后由 JS 移除） */
  .tab-panel::after {
    content: '加载中…';
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: var(--font-mono);
    font-size: 11px;
    letter-spacing: 0.32em;
    text-indent: 0.32em;
    color: var(--text-faint);
    pointer-events: none;
    z-index: 2;
  }
  .tab-panel.loaded::after { display: none; }
  .tab-panel iframe {
    flex: 1;
    min-height: 0;
    width: 100%;
    border: none;
    display: block;
    background: var(--bg);
  }

  @media (max-width: 720px) {
    .hero { padding: 32px 20px 20px; }
    .hero h1 { font-size: 26px; }
    .stat-strip { gap: 16px; }
    .tabs { padding: 0 16px; }
    .tab-btn { padding: 11px 12px; font-size: 12px; }
    .tab-panels { min-height: 68vh; }
  }
</style>
</head>

<script>
  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const target = btn.dataset.tab;
      document.querySelectorAll('.tab-btn').forEach(b => {
        b.classList.remove('active');
        b.setAttribute('aria-selected', 'false');
      });
      document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
      btn.classList.add('active');
      btn.setAttribute('aria-selected', 'true');
      document.getElementById('panel-' + target).classList.add('active');
    });
  });
  // iframe 加载完成后移除"加载中"占位
  document.querySelectorAll('.tab-panel iframe').forEach(frame => {
    frame.addEventListener('load', () => frame.closest('.tab-panel').classList.add('loaded'));
  });
  // 全局语言切换：切换 index 外壳文案 + 所有厂商 iframe 的 zh/en 版本（保持 ?embed=1 嵌入态），偏好记忆在 localStorage
  const I18N = {
    'title':        { zh: '大模型选型与场景指南', en: 'LLM Selection & Scenario Guide' },
    'h1':           { zh: '大模型选型与场景指南', en: 'LLM Selection & Scenario Guide' },
    'hero-desc':    { zh: '面对 OpenAI、阿里 Qwen、Google Gemini、智谱 Z.ai 众多模型不知如何下手？本指南从实际场景出发，帮你快速理解各模型能力边界，选对模型、用对场景。',
                      en: 'Overwhelmed by OpenAI, Alibaba Qwen, Google Gemini and Zhipu Z.ai models? This guide starts from real scenarios to help you quickly understand each model\u2019s capabilities and pick the right model for the right scenario.' },
    'stat-models':  { zh: '收录模型', en: 'Models' },
    'stat-vendors': { zh: '厂商选型', en: 'Vendors' },
    'stat-context': { zh: '最大上下文', en: 'Max context' },
    'tab-openai':   { zh: 'OpenAI', en: 'OpenAI' },
    'tab-gemini':   { zh: 'Google Gemini', en: 'Google Gemini' },
    'tab-qwen':     { zh: '阿里 Qwen', en: 'Qwen' },
    'tab-zai':      { zh: '智谱 Z.ai', en: 'Z.ai' },
    'tablist':      { zh: '厂商指南切换', en: 'Vendor guides' },
  };
  function applyShell(lang) {
    document.querySelectorAll('[data-i18n]').forEach(el => {
      const t = I18N[el.dataset.i18n];
      if (t) el.textContent = t[lang];
    });
    document.querySelectorAll('[data-i18n-aria]').forEach(el => {
      const t = I18N[el.dataset.i18nAria];
      if (t) el.setAttribute('aria-label', t[lang]);
    });
    document.title = I18N.title[lang];
  }
  const langBtns = Array.prototype.slice.call(document.querySelectorAll('.lang-switch .lang-opt'));
  function setLang(lang) {
    applyShell(lang);
    document.querySelectorAll('.tab-panel iframe').forEach(frame => {
      const src = lang === 'en' ? frame.dataset.enSrc : frame.dataset.zhSrc;
      const title = lang === 'en' ? frame.dataset.enTitle : frame.dataset.zhTitle;
      if (frame.getAttribute('src') !== src) {
        frame.closest('.tab-panel').classList.remove('loaded'); // 重新显示"加载中"占位
        frame.setAttribute('src', src);
      }
      frame.setAttribute('title', title);
    });
    langBtns.forEach(btn => {
      const on = btn.dataset.lang === lang;
      btn.classList.toggle('on', on);
      if (on) btn.setAttribute('aria-current', 'true'); else btn.removeAttribute('aria-current');
    });
    try { localStorage.setItem('model-guide-lang', lang); } catch (e) {}
  }
  langBtns.forEach(btn => btn.addEventListener('click', () => setLang(btn.dataset.lang)));
  try {
    if (localStorage.getItem('model-guide-lang') === 'en') setLang('en');
  } catch (e) {}
</script>

</body>
</html>
